# Config de launcher icons para el APK de DEMO.
# Uso: dart run flutter_launcher_icons -f flutter_launcher_icons-demo.yaml
# Restaura el icono de producción con:
#   dart run flutter_launcher_icons
#
# Genera iconos con una cinta "DEMO" roja centrada y fondo ámbar (distinto
# del fondo de producción), para distinguir el APK de demo del de
# producción en el mismo teléfono.

flutter_launcher_icons:
  android: true
  adaptive_icon_background: "#F6DFAE"
  ios: true
  image_path: "assets/logo/logo_demo.png"